services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial}
      POSTGRES_DB: ${POSTGRES_DB:-editorial_tracker}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-editorial}:${POSTGRES_PASSWORD:-editorial}@db:5432/${POSTGRES_DB:-editorial_tracker}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  setup:
    build:
      context: .
      target: setup
    profiles: ['setup']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-editorial}:${POSTGRES_PASSWORD:-editorial}@db:5432/${POSTGRES_DB:-editorial_tracker}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
